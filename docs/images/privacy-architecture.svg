<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="620" viewBox="0 0 1180 620" role="img" aria-labelledby="title desc">
  <title id="title">Cartridge Store privacy architecture</title>
  <desc id="desc">Data flows from learners, devices, administrators, and identity providers through HTTPS to the Cartridge Store, then to filesystem and SQLite storage with retention, export, and erasure controls.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#51606f"/></marker>
    <style>
      .box{fill:#fff;stroke:#174ea6;stroke-width:2;rx:14}.store{fill:#e8f0fe;stroke:#174ea6;stroke-width:3;rx:18}.data{fill:#e6f4ea;stroke:#137333;stroke-width:2;rx:14}.control{fill:#fef7e0;stroke:#b06000;stroke-width:2;rx:14}.t{font:600 18px system-ui,sans-serif;fill:#17212b}.s{font:14px system-ui,sans-serif;fill:#3d4b59}.line{stroke:#51606f;stroke-width:2;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1180" height="620" fill="#f7f9fb"/>
  <text x="590" y="42" text-anchor="middle" class="t" font-size="25">PRG32 Cartridge Store — privacy and data flow</text>
  <rect class="box" x="40" y="100" width="220" height="110"/><text class="t" x="150" y="137" text-anchor="middle">People &amp; devices</text><text class="s" x="150" y="166" text-anchor="middle">learners · teachers · admins</text><text class="s" x="150" y="188" text-anchor="middle">PRG32 clients</text>
  <rect class="box" x="40" y="270" width="220" height="110"/><text class="t" x="150" y="307" text-anchor="middle">Configured services</text><text class="s" x="150" y="336" text-anchor="middle">LDAP · OIDC · SAML · SMTP</text><text class="s" x="150" y="358" text-anchor="middle">Construction Kit SSO</text>
  <rect class="store" x="380" y="120" width="390" height="280"/><text class="t" x="575" y="162" text-anchor="middle">Cartridge Store</text><text class="s" x="575" y="194" text-anchor="middle">Flask web/PWA · REST · WebSocket</text><text class="s" x="575" y="224" text-anchor="middle">authentication · roles · review</text><text class="s" x="575" y="254" text-anchor="middle">scores · metrics · download telemetry</text><rect class="control" x="425" y="292" width="300" height="78"/><text class="t" x="575" y="322" text-anchor="middle">Privacy controls</text><text class="s" x="575" y="348" text-anchor="middle">notice · export · erasure · retention</text>
  <rect class="data" x="900" y="100" width="230" height="120"/><text class="t" x="1015" y="139" text-anchor="middle">Filesystem</text><text class="s" x="1015" y="169" text-anchor="middle">cartridges · images</text><text class="s" x="1015" y="192" text-anchor="middle">pending submissions</text>
  <rect class="data" x="900" y="280" width="230" height="120"/><text class="t" x="1015" y="319" text-anchor="middle">SQLite</text><text class="s" x="1015" y="349" text-anchor="middle">accounts · scores · runs</text><text class="s" x="1015" y="372" text-anchor="middle">reviews · telemetry</text>
  <rect class="control" x="380" y="485" width="390" height="95"/><text class="t" x="575" y="521" text-anchor="middle">Operator responsibilities</text><text class="s" x="575" y="549" text-anchor="middle">HTTPS · processor terms · backups · ROPA</text><text class="s" x="575" y="570" text-anchor="middle">DPIA · breach response · periodic review</text>
  <path class="line" d="M260 155 H380"/><text class="s" x="320" y="145" text-anchor="middle">HTTPS</text>
  <path class="line" d="M260 325 H380"/><path class="line" d="M770 175 H900"/><path class="line" d="M770 340 H900"/><path class="line" d="M575 400 V485"/>
</svg>
