{% extends "base.html" %}

{% block title %}Groups - {{ store_name }}{% endblock %}

{% block content %}
<section class="table-panel">
  <h1>Groups</h1>
  <form method="post" action="/admin/groups" class="inline-admin-form">
    <label>New group<input name="name" required></label>
    <button type="submit">Create group</button>
  </form>
  <table>
    <thead>
      <tr><th scope="col">Name</th><th scope="col">Users</th><th scope="col">Created</th><th scope="col">Actions</th></tr>
    </thead>
    <tbody>
      {% for group in groups %}
      <tr>
        <td>
          <form method="post" action="/admin/groups/{{ group.id }}" class="inline-admin-form">
            <input name="name" value="{{ group.name }}" aria-label="Name of group {{ group.name }}" required>
            <button type="submit">Save<span class="visually-hidden"> {{ group.name }}</span></button>
          </form>
        </td>
        <td>{{ group.user_count }}</td>
        <td>{{ group.created_at }}</td>
        <td>
          <form method="post" action="/admin/groups/{{ group.id }}/delete" data-confirm="Delete group {{ group.name }}?">
            <button class="danger" type="submit" {% if group.name == "editors" %}disabled aria-describedby="editorsNote"{% endif %}>Delete<span class="visually-hidden"> {{ group.name }}</span></button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  <p class="field-help" id="editorsNote">The <code>editors</code> group reviews submissions and cannot be deleted.</p>
</section>
{% endblock %}
