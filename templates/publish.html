{% extends "base.html" %}

{% block title %}Publish - {{ store_name }}{% endblock %}
{% block main_class %}publish{% endblock %}

{% block content %}
<section class="bundle-panel">
  <h1>Upload Cartridge Package</h1>
  <form id="bundle-publish-form" method="post" action="/publish" enctype="multipart/form-data">
    <label>Cartridge bundle (.zip)<input type="file" name="bundle" accept=".zip" required></label>
    <button class="primary" type="submit">Upload for Review</button>
  </form>
  <div id="bundle-result" class="result-area" aria-live="polite"></div>
</section>
{% endblock %}

{% block scripts %}
<script>
  document.getElementById("bundle-publish-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const result = document.getElementById("bundle-result");
    result.textContent = "";
    const response = await fetch("/api/publish/bundle", {
      method: "POST",
      body: new FormData(event.currentTarget),
      headers: { "Accept": "application/json" }
    });
    const data = await response.json();
    if (!response.ok) {
      result.textContent = data.error || "Upload failed";
      result.className = "result-area error-text";
      return;
    }
    const list = document.createElement("ul");
    for (const item of data.submitted || []) {
      const row = document.createElement("li");
      row.textContent = `${item.architecture}: ${item.file}`;
      list.appendChild(row);
    }
    result.className = "result-area success-text";
    result.textContent = `Submission #${data.submission_id} is waiting for editor verification.`;
    result.appendChild(list);
  });
</script>
{% endblock %}
